<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guided weapons: top 10 trends</title>
<style>
:root{--bg:#e9edf0;--card:#fbfcfd;--ink:#14202b;--mute:#5a6b79;--line:#c9d2d9;--tracer:#d98a00;--tint:#fff3d6;--warn:#8a2d0b}
@media (prefers-color-scheme:dark){:root:not([data-x]){--bg:#0d141b;--card:#16212b;--ink:#e8eef3;--mute:#93a5b4;--line:#2a3a47;--tracer:#f2b01e;--tint:#2b2410;--warn:#ffb08a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 1.75rem/1.15 Georgia,"Iowan Old Style",serif;margin:0 0 6px;letter-spacing:-.01em}
.meta{color:var(--mute);font-size:.9rem;margin:0}
.warn{background:var(--tint);border-left:4px solid var(--tracer);color:var(--warn);padding:10px 12px;margin:14px 0 0;border-radius:4px;font-size:.92rem}
.take{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--tracer);border-radius:8px;padding:14px 16px;margin:18px 0}
.take h2{font:700 1.05rem Georgia,serif;margin:0 0 6px}.take p{margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.bar .sp{flex:1}
button{font:inherit;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,a:focus-visible{outline:3px solid var(--tracer);outline-offset:2px}
ol{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
ol::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;border-left:2px dashed var(--line)}
li{position:relative;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 0 14px}
.n{position:absolute;left:-33px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--tracer);color:#14202b;font:700 .8rem/24px system-ui;text-align:center}
.tag{display:inline-block;font-size:.8rem;font-weight:600;border:1px solid var(--tracer);color:var(--ink);border-radius:4px;padding:1px 8px}
h3{font:700 1.15rem/1.3 Georgia,serif;margin:8px 0 6px}
li p{margin:0 0 10px}.src{color:var(--mute);font-size:.88rem}
.go{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:6px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600}
.state{text-align:center;color:var(--mute);padding:40px 0}
footer{color:var(--mute);font-size:.85rem;margin-top:24px}
@media (prefers-reduced-motion:no-preference){.state.load{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{opacity:.4}}}
</style>
</head>
<body>
<main>
<header>
<h1>Guided weapons: top 10 trends</h1>
<p class="meta" id="meta">Loading…</p>
<div class="warn" id="stale" hidden></div>
</header>
<div id="app"><p class="state load">Fetching today's briefing…</p></div>
<footer>Summaries are AI-generated from public headlines and feed snippets. Verify against the source before relying on them.</footer>
</main>
<script>
const $=s=>document.querySelector(s);
const h=(t,a,...k)=>{const e=document.createElement(t);for(const x in a||{})x==="class"?e.className=a[x]:e.setAttribute(x,a[x]);k.flat().forEach(c=>e.append(c));return e};
let D,cat="All",sort="rank";
const rel=iso=>{const m=Math.round((new Date(iso)-Date.now())/6e4),f=new Intl.RelativeTimeFormat(undefined,{numeric:"auto"}),a=Math.abs(m);
 return a<60?f.format(m,"minute"):a<2880?f.format(Math.round(m/60),"hour"):f.format(Math.round(m/1440),"day")};
const safe=u=>/^https?:\/\//.test(u)?u:"#";
function draw(){
 const app=$("#app");app.replaceChildren();
 if(!D.items.length){app.append(h("p",{class:"state"},"No briefing yet. The first update will appear after the next scheduled run."));return}
 app.append(h("section",{class:"take"},h("h2",{},"Today's takeaway"),h("p",{},D.takeaway)));
 const cats=["All",...new Set(D.items.map(i=>i.category))];
 const bar=h("div",{class:"bar",role:"group","aria-label":"Filter and sort"});
 cats.forEach(c=>bar.append(h("button",{"aria-pressed":c===cat,onclick:()=>{cat=c;draw()}},c)));
 bar.append(h("span",{class:"sp"}));
 [["rank","Most important"],["new","Newest"]].forEach(([k,l])=>bar.append(h("button",{"aria-pressed":sort===k,onclick:()=>{sort=k;draw()}},l)));
 app.append(bar);
 let L=D.items.filter(i=>cat==="All"||i.category===cat);
 L=[...L].sort(sort==="new"?(a,b)=>new Date(b.published)-new Date(a.published):(a,b)=>a.rank-b.rank);
 app.append(h("ol",{},L.map(i=>h("li",{},h("span",{class:"n"},i.rank),h("span",{class:"tag"},i.category),h("h3",{},i.headline),h("p",{},i.why),
  h("p",{class:"src"},`${i.source}, ${rel(i.published)}`),h("a",{class:"go",href:safe(i.url),target:"_blank",rel:"noopener noreferrer"},"Read source")))));
}
fetch("data.json?"+Date.now()).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
 D=d;$("#meta").textContent=d.generated_at?`${d.topic}. Updated ${new Date(d.generated_at).toLocaleString([], {dateStyle:"medium",timeStyle:"short"})}`:d.topic;
 const age=d.generated_at?(Date.now()-new Date(d.generated_at))/36e5:0;
 if(d.generated_at&&age>(d.stale_after_hours||24)){const s=$("#stale");s.hidden=false;s.textContent=`This briefing is ${Math.round(age)} hours old. The daily update may have failed.`}
 draw();
}).catch(()=>{$("#meta").textContent="";$("#app").replaceChildren(h("p",{class:"state"},"Couldn't load the briefing. Check your connection and reload the page."))});
</script>
</body>
</html>
